<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Apply Localize</title>
  <style>
    :root {
      --gap: 8px;
      --radius: 8px;
      --c-text: var(--figma-color-text, #1e1e1e);
      --c-text2: var(--figma-color-text-secondary, #6b6b6b);
      --c-border: var(--figma-color-border, #e2e2e2);
      --c-bg: var(--figma-color-bg, #fff);
      --c-bg2: var(--figma-color-bg-secondary, #f5f5f5);
      --c-brand: var(--figma-color-bg-brand, #0d99ff);
      --c-success: var(--figma-color-text-success, #14ae5c);
      --c-danger: var(--figma-color-text-danger, #f24822);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 0; height: auto; color: var(--c-text); }
    body { font: 12px/1.5 Inter, sans-serif; }
    #plugin-root { height: auto; }
    fig-content { display: block; gap: 12px; padding: 12px 16px 16px; }
    fig-group { display: grid; gap: 12px; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--c-brand); outline-offset: 1px; }

    /* ---------- Toolbar ---------- */
    .toolbar { display: grid; gap: var(--gap); position: sticky; top: 0; z-index: 2; background: var(--c-bg); margin: -12px -16px 0; padding: 12px 16px 8px; }
    .toolbar-row { display: flex; gap: var(--gap); align-items: center; }
    .collection-filters { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; margin: 0; padding: 0; border: 0; }
    .collection-filters legend { margin-bottom: 4px; color: var(--c-text2); font-size: 12px; }
    .collection-filter { position: relative; display: inline-flex; min-width: 0; cursor: pointer; }
    .collection-filter input { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .filter-visual { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 8px 12px; border: 1px solid var(--c-border); border-radius: 999px; background: var(--c-bg); color: var(--c-text); }
    .collection-filter:hover .filter-visual { border-color: var(--c-text2); background: var(--c-bg2); }
    .collection-filter input:checked + .filter-visual { border-color: var(--c-text); background: var(--c-text); color: var(--c-bg); font-weight: 600; }
    .collection-filter input:focus-visible + .filter-visual { outline: 2px solid var(--c-text); outline-offset: 2px; }
    .collection-filter input:disabled + .filter-visual { opacity: .5; cursor: default; }
    .filter-count { font-size: 12px; font-weight: 400; opacity: .8; }
    .search { flex: 1; position: relative; }
    .search input { width: 100%; height: 28px; padding: 0 8px 0 28px; border: 1px solid var(--c-border); border-radius: 6px; background: var(--c-bg); color: var(--c-text); font: inherit; }
    .search input::placeholder { color: var(--c-text2); }
    .search svg { position: absolute; left: 8px; top: 7px; width: 14px; height: 14px; opacity: .55; pointer-events: none; }
    .icon-btn { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border: 1px solid var(--c-border); border-radius: 6px; background: var(--c-bg); cursor: pointer; }
    .icon-btn:hover:not([disabled]) { background: var(--c-bg2); }
    .icon-btn[disabled] { opacity: .45; cursor: default; }
    .icon-btn svg { width: 14px; height: 14px; }
    .spinning svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .progress { height: 2px; border-radius: 2px; background: var(--c-bg2); overflow: hidden; visibility: hidden; }
    .progress.on { visibility: visible; }
    .progress > i { display: block; height: 100%; width: 35%; background: var(--c-brand); border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
    .progress.determinate > i { animation: none; transition: width .15s ease; }
    @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }

    .summary { display: flex; align-items: center; justify-content: space-between; gap: var(--gap); min-height: 20px; }
    .count { font-weight: 600; }
    .check-all { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--c-text2); user-select: none; }
    .status { color: var(--c-text2); font-size: 12px; min-height: 18px; }
    .status.error { color: var(--c-danger); }
    .status.ok { color: var(--c-success); }

    /* ---------- Results ---------- */
    #results { display: grid; gap: 12px; min-width: 0; }
    .collection-section { display: grid; gap: 10px; width: 100%; min-width: 0; padding: 10px; border: 1px solid var(--c-border); border-left: 3px solid var(--c-brand); border-radius: var(--radius); background: var(--c-bg2); }
    .collection-section > *, .group-list { min-width: 0; max-width: 100%; }
    .collection-heading { display: flex; align-items: center; justify-content: space-between; gap: var(--gap); font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
    .collection-heading .n, .group-title .n { font-weight: 400; color: var(--c-text2); }
    .group-title { display: flex; align-items: center; justify-content: space-between; gap: var(--gap); font-size: 12px; font-weight: 600; color: var(--c-text2); padding: 0 2px 2px; }
    .group-list { display: grid; gap: var(--gap); }

    .row { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 0 8px; width: 100%; min-width: 0; max-width: 100%; border: 1px solid var(--c-border); border-radius: var(--radius); padding: 10px; background: var(--c-bg); transition: border-color .12s, background .12s; }
    .row:hover { border-color: var(--c-text2); }
    .row.checked { border-color: var(--c-brand); background: var(--c-bg); }
    .row input[type=checkbox] { margin: 0; width: 24px; height: 24px; accent-color: var(--c-brand); cursor: pointer; }
    .row input[type=checkbox][disabled] { cursor: default; opacity: .4; }
    .row-body { display: grid; gap: 6px; min-width: 0; max-width: 100%; }
    .row-body > *, .row-body select[data-variable-select] { width: 100%; min-width: 0; max-width: 100%; }
    .variable-select { display: block; height: 44px; padding: 8px 32px 8px 10px; overflow: hidden; border: 1px solid var(--c-border); border-radius: 6px; background: var(--c-bg); color: var(--c-text); font: inherit; text-overflow: ellipsis; white-space: nowrap; }
    .variable-select:focus-visible { outline: 2px solid var(--c-text); outline-offset: 2px; }
    .row-head { display: flex; align-items: center; justify-content: space-between; gap: var(--gap); }
    .collection-badge { flex: none; max-width: 45%; padding: 2px 7px; border-radius: 999px; background: var(--c-bg2); color: var(--c-text2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .layer { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
    .layer:hover { text-decoration: underline; }
    .path { min-width: 0; color: var(--c-text2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
    .path > bdi { direction: ltr; }
    .text-box { padding: 6px 8px; border-radius: 6px; background: var(--c-bg2); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .arrow { min-width: 0; color: var(--c-text2); font-size: 12px; display: flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }
    .arrow::before { content: ''; width: 1px; height: 10px; background: var(--c-border); margin-left: 6px; }
    .value { min-width: 0; color: var(--c-text2); font-size: 12px; overflow-wrap: anywhere; word-break: break-word; }
    .value b { font-weight: 500; color: var(--c-text); }
    .pill { display: inline-flex; align-items: center; min-height: 24px; max-width: 100%; padding: 2px 8px; border-radius: 12px; font-size: 12px; background: var(--c-bg2); color: var(--c-text2); white-space: normal; overflow-wrap: anywhere; }
    .pill.warn { color: var(--c-danger); }
    .row-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--gap); width: 100%; min-width: 0; max-width: 100%; flex-wrap: wrap; }
    .link { display: inline-flex; align-items: center; min-height: 32px; background: none; border: 0; padding: 0 4px; margin-left: -4px; border-radius: 4px; color: var(--c-text2); cursor: pointer; font-size: 12px; }
    .link:hover { color: var(--c-text); text-decoration: underline; }
    .apply-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 14px; border: 1px solid var(--c-text); border-radius: 6px; background: var(--c-text); color: var(--c-bg); font: inherit; font-weight: 600; cursor: pointer; transition: filter .12s, transform .12s; }
    .apply-btn:hover:not(:disabled) { filter: brightness(.88); }
    .apply-btn:active:not(:disabled) { transform: translateY(1px); }
    .apply-btn:focus-visible { outline: 2px solid var(--c-text); outline-offset: 2px; }
    .apply-btn:disabled { border-color: var(--c-border); background: var(--c-bg2); color: var(--c-text2); opacity: .75; cursor: not-allowed; }
    .apply-btn--row { position: relative; flex: 0 0 auto; min-width: 80px; min-height: 32px; padding: 0 16px; font-size: 12px; line-height: 1; margin-left: auto; }
    /* ขยายพื้นที่คลิกที่มองไม่เห็นให้ได้ 44px (WCAG 2.5.5) โดยไม่ทำให้ปุ่มดูใหญ่เกินใน panel */
    .apply-btn--row::after { content: ''; position: absolute; inset: -7px -4px; }
    .apply-btn--primary { position: relative; min-width: 116px; min-height: 36px; padding: 0 16px; font-size: 12px; line-height: 1; }
    /* พื้นที่คลิกจริงให้ได้ 44px (WCAG 2.5.5) */
    .apply-btn--primary::after { content: ''; position: absolute; inset: -5px -4px; }

    .empty { text-align: center; padding: 28px 16px; border: 1px dashed var(--c-border); border-radius: var(--radius); color: var(--c-text2); display: grid; gap: 6px; justify-items: center; }
    .empty strong { color: var(--c-text); font-size: 12px; }
    .empty svg { width: 24px; height: 24px; opacity: .5; }
    .skeleton { height: 112px; border-radius: var(--radius); background: linear-gradient(90deg, var(--c-bg2) 25%, var(--c-border) 50%, var(--c-bg2) 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite; opacity: .6; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .note { font-size: 12px; color: var(--c-text2); margin: 0; padding: 8px 10px; border-radius: 6px; background: var(--c-bg2); }
    .note:empty { display: none; }

    /* ---------- Footer ---------- */
    fig-footer { display: block; padding: 12px 16px; background: var(--c-bg); box-shadow: inset 0 1px 0 var(--c-border); }
    .footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; }
    .footer-info { color: var(--c-text2); font-size: 12px; }
    @media (max-width: 300px) { .collection-filter { flex: 1 1 auto; justify-content: center; } .footer-inner { align-items: flex-start; flex-direction: column; } .apply-btn--primary { width: 100%; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div id="plugin-root">
    <fig-content>
      <fig-group name="Apply Localize">
        <div class="toolbar">
          <div class="toolbar-row">
            <label class="search">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14" stroke-linecap="round"/></svg>
              <input id="search" type="search" placeholder="ค้นหาชื่อ layer หรือข้อความ" aria-label="ค้นหา text layer" autocomplete="off">
            </label>
            <button id="rescan" class="icon-btn" title="สแกนใหม่ทั้งไฟล์" aria-label="สแกนใหม่ทั้งไฟล์">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>
            </button>
          </div>
          <div class="toolbar-row">
            <fieldset id="collection-filters" class="collection-filters">
              <legend>กรองตาม collection</legend>
            </fieldset>
          </div>
          <div class="progress" id="progress" aria-hidden="true"><i></i></div>
          <div class="summary">
            <label class="check-all"><input id="check-all" type="checkbox" disabled> <span id="count" class="count">กำลังเริ่มสแกน…</span></label>
          </div>
          <div id="status" class="status" role="status" aria-live="polite"></div>
        </div>
        <div id="results"></div>
        <p id="unresolved" class="note"></p>
      </fig-group>
    </fig-content>
    <fig-footer sticky>
      <div class="footer-inner">
        <span id="footer-info" class="footer-info">ยังไม่ได้เลือกรายการ</span>
        <button id="apply-all" class="apply-btn apply-btn--primary" type="button" disabled>Apply</button>
      </div>
    </fig-footer>
  </div>
  <script>
    function post(message) {
      parent.postMessage({ pluginMessage: message }, '*')
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function (char) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]
      })
    }

    // ---------- State ----------
    var rows = []
    var selection = {}   // nodeId -> variableId ที่ผู้ใช้เลือกเอง
    var unchecked = {}   // nodeId -> true เมื่อผู้ใช้เอาติ๊กออก
    var query = ''
    var busy = false
    var scanning = false
    var pendingSummary = ''
    var root = document.getElementById('plugin-root')
    var results = document.getElementById('results')
    var statusEl = document.getElementById('status')
    var collectionFilters = document.getElementById('collection-filters')
    var collections = []
    var selectedCollectionId = ''
    var applyAll = document.getElementById('apply-all')
    var checkAll = document.getElementById('check-all')
    var progress = document.getElementById('progress')
    var rescanBtn = document.getElementById('rescan')

    function setStatus(text, kind) {
      statusEl.textContent = text || ''
      statusEl.className = 'status' + (kind ? ' ' + kind : '')
    }

    function setProgress(mode, ratio) {
      progress.className = 'progress' + (mode ? ' on' : '') + (mode === 'determinate' ? ' determinate' : '')
      progress.firstElementChild.style.width = mode === 'determinate' ? Math.round(ratio * 100) + '%' : ''
    }

    function selectedCollection() {
      return selectedCollectionId
    }

    function candidatesFor(row) {
      var collectionId = selectedCollection()
      return collectionId
        ? row.candidates.filter(function (candidate) { return candidate.collectionId === collectionId })
        : row.candidates
    }

    // variable ที่จะถูก apply ของแถวนี้ (เลือกเอง หรือ auto เมื่อมีตัวเลือกเดียว)
    function effectiveVariable(row) {
      var candidates = candidatesFor(row)
      var chosen = selection[row.nodeId]
      if (chosen && candidates.some(function (c) { return c.variableId === chosen })) return chosen
      return candidates.length === 1 ? candidates[0].variableId : ''
    }

    function isChecked(row) {
      return !!effectiveVariable(row) && !unchecked[row.nodeId]
    }

    function matchesQuery(row) {
      if (!query) return true
      var haystack = (row.nodeName + ' ' + row.textPreview + ' ' + row.path).toLowerCase()
      return haystack.indexOf(query) !== -1
    }

    function visibleRows() {
      return rows.filter(function (row) { return candidatesFor(row).length > 0 && matchesQuery(row) })
    }

    // ---------- Render ----------
    var ICONS = {
      empty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h6"/></svg>',
      done: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>'
    }

    function emptyState(icon, title, hint) {
      return '<div class="empty">' + icon + '<strong>' + escapeHtml(title) + '</strong><span>' + escapeHtml(hint) + '</span></div>'
    }

    function rowHtml(row) {
      var candidates = candidatesFor(row)
      var effective = effectiveVariable(row)
      var checked = isChecked(row)
      var id = escapeHtml(row.nodeId)
      var options = (candidates.length > 1 ? '<option value="">เลือก variable…</option>' : '') + candidates.map(function (c) {
        return '<option value="' + escapeHtml(c.variableId) + '"' + (c.variableId === effective ? ' selected' : '') + '>' +
          escapeHtml(c.collectionName + ' · ' + c.variableName) + '</option>'
      }).join('')
      var current = candidates.filter(function (c) { return c.variableId === effective })[0]
      var collectionNames = candidates.map(function (candidate) { return candidate.collectionName }).filter(function (name, index, all) { return all.indexOf(name) === index })
      var collectionLabel = current ? current.collectionName : (collectionNames.length === 1 ? collectionNames[0] : 'เลือก collection')
      var hint = current
        ? 'จะเปลี่ยนเป็น: <b>' + escapeHtml(current.valuePreview || '(ค่าว่าง)') + '</b>'
        : '<span class="pill warn">พบ ' + candidates.length + ' ตัวเลือก · เลือก variable ก่อน</span>'

      return '<article class="row' + (checked ? ' checked' : '') + '" data-row="' + id + '">' +
        '<input type="checkbox" data-check="' + id + '"' + (checked ? ' checked' : '') + (effective ? '' : ' disabled') + ' aria-label="เลือก ' + escapeHtml(row.nodeName) + '">' +
        '<div class="row-body">' +
          '<div class="row-head">' +
            '<button class="layer" data-locate="' + id + '" data-page="' + escapeHtml(row.pageName) + '" title="ไปที่ layer นี้ใน canvas">' + escapeHtml(row.nodeName) + '</button>' +
            '<span class="collection-badge" title="' + escapeHtml(collectionLabel) + '">' + escapeHtml(collectionLabel) + '</span>' +
          '</div>' +
          '<div class="path" title="' + escapeHtml(row.path) + '"><bdi>' + escapeHtml(row.path) + '</bdi></div>' +
          '<div class="text-box">' + escapeHtml(row.textPreview || '(ไม่มีข้อความ)') + '</div>' +
          '<div class="arrow">' + escapeHtml(row.reason) + '</div>' +
          '<select class="variable-select" data-variable-select="' + id + '" aria-label="เลือก string variable">' + options + '</select>' +
          '<div class="value">' + hint + '</div>' +
          '<div class="row-foot">' +
            '<button class="link" data-locate="' + id + '" data-page="' + escapeHtml(row.pageName) + '">ไปที่ layer</button>' +
            '<button type="button" class="apply-btn apply-btn--row" data-apply-one="' + id + '"' + (effective && !busy ? '' : ' disabled') + '>Apply</button>' +
          '</div>' +
        '</div>' +
      '</article>'
    }

    function render() {
      renderCollectionFilters()
      var visible = visibleRows()
      var checkedCount = visible.filter(isChecked).length
      var actionable = visible.filter(function (row) { return !!effectiveVariable(row) })

      // Header summary
      var countEl = document.getElementById('count')
      if (scanning) countEl.textContent = 'กำลังสแกน…'
      else if (!rows.length) countEl.textContent = 'ไม่พบรายการ'
      else countEl.textContent = 'พบ ' + visible.length + ' จาก ' + rows.length + ' layer'
      checkAll.disabled = busy || actionable.length === 0
      checkAll.checked = actionable.length > 0 && actionable.every(isChecked)
      checkAll.indeterminate = checkedCount > 0 && !checkAll.checked

      // Body
      if (scanning) {
        results.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>'
      } else if (!visible.length) {
        if (!rows.length) results.innerHTML = emptyState(ICONS.done, 'ไม่มี layer ที่ต้อง apply', 'ทุก text layer ที่ชื่อตรงกับ variable ถูกผูกไว้แล้ว')
        else if (query) results.innerHTML = emptyState(ICONS.empty, 'ไม่พบผลลัพธ์', 'ลองค้นหาด้วยคำอื่น หรือล้างช่องค้นหา')
        else results.innerHTML = emptyState(ICONS.empty, 'ไม่มีรายการใน collection นี้', 'ลองเลือก "ทุก collection"')
      } else {
        var collectionGroups = {}
        var collectionOrder = []
        visible.forEach(function (row) {
          var chosen = candidatesFor(row).filter(function (candidate) { return candidate.variableId === effectiveVariable(row) })[0]
          var rowCollections = candidatesFor(row).map(function (candidate) { return candidate.collectionId }).filter(function (id, index, all) { return all.indexOf(id) === index })
          var collectionId = chosen ? chosen.collectionId : (rowCollections.length === 1 ? rowCollections[0] : '__choose_collection__')
          if (!collectionGroups[collectionId]) { collectionGroups[collectionId] = []; collectionOrder.push(collectionId) }
          collectionGroups[collectionId].push(row)
        })
        collectionOrder.sort(function (a, b) {
          if (a === '__choose_collection__') return 1
          if (b === '__choose_collection__') return -1
          return collections.findIndex(function (collection) { return collection.id === a }) - collections.findIndex(function (collection) { return collection.id === b })
        })
        results.innerHTML = collectionOrder.map(function (collectionId) {
          var collection = collections.filter(function (item) { return item.id === collectionId })[0]
          var collectionName = collection ? collection.name : 'เลือก collection ก่อน apply'
          var groupRows = collectionGroups[collectionId]
          var pages = {}
          var pageOrder = []
          groupRows.forEach(function (row) {
            if (!pages[row.pageName]) { pages[row.pageName] = []; pageOrder.push(row.pageName) }
            pages[row.pageName].push(row)
          })
          return '<section class="collection-section"><div class="collection-heading"><span>' + escapeHtml(collectionName) + '</span><span class="n">' + groupRows.length + ' รายการ</span></div>' +
            pageOrder.map(function (page) {
              return '<div><div class="group-title"><span>' + escapeHtml(page) + '</span><span class="n">' + pages[page].length + ' รายการ</span></div>' +
                '<div class="group-list">' + pages[page].map(rowHtml).join('') + '</div></div>'
            }).join('') + '</section>'
        }).join('')
      }

      // Footer
      applyAll.disabled = busy || checkedCount === 0
      applyAll.textContent = checkedCount ? 'Apply ' + checkedCount + ' รายการ' : 'Apply'
      document.getElementById('footer-info').textContent = checkedCount
        ? 'เลือกไว้ ' + checkedCount + ' จาก ' + visible.length + ' รายการ'
        : (visible.length ? 'ติ๊กรายการที่ต้องการ apply' : 'ยังไม่มีรายการให้ apply')
      rescanBtn.disabled = busy
      rescanBtn.className = 'icon-btn' + (scanning ? ' spinning' : '')
      reportHeight()
    }

    var lastHeight = 0
    var resizeFrame = 0
    function reportHeight() {
      if (resizeFrame) cancelAnimationFrame(resizeFrame)
      resizeFrame = requestAnimationFrame(function () {
        var height = Math.ceil(root.getBoundingClientRect().height)
        if (height > 0 && height !== lastHeight) {
          lastHeight = height
          post({ type: 'resize', height: height })
        }
      })
    }

    function setBusy(value) {
      busy = value
      render()
    }

    function loadCollections(items) {
      collections = items || []
      if (!collections.some(function (collection) { return collection.id === selectedCollectionId })) selectedCollectionId = ''
      renderCollectionFilters()
    }

    function renderCollectionFilters() {
      var focusedValue = document.activeElement && document.activeElement.name === 'collection-filter'
        ? document.activeElement.value
        : null
      var matchingRows = rows.filter(matchesQuery)
      var options = [{ id: '', name: 'ทุก collection', count: matchingRows.length }].concat(collections.map(function (collection) {
        return {
          id: collection.id,
          name: collection.name,
          count: matchingRows.filter(function (row) {
            return row.candidates.some(function (candidate) { return candidate.collectionId === collection.id })
          }).length
        }
      }))
      collectionFilters.innerHTML = options.map(function (collection) {
        var selected = collection.id === selectedCollectionId
        return '<label class="collection-filter"><input type="radio" name="collection-filter" value="' + escapeHtml(collection.id) + '"' + (selected ? ' checked' : '') + (busy ? ' disabled' : '') + '>' +
          '<span class="filter-visual"><span>' + escapeHtml(collection.name) + '</span><span class="filter-count">' + collection.count + '</span></span></label>'
      }).join('')
      if (focusedValue !== null) {
        Array.prototype.forEach.call(collectionFilters.querySelectorAll('input[name="collection-filter"]'), function (input) {
          if (input.value === focusedValue) input.focus()
        })
      }
    }

    function startScan() {
      scanning = true
      rows = []
      setBusy(true)
      setProgress('indeterminate')
      setStatus('กำลังเตรียมสแกน…')
      post({ type: 'scan' })
    }

    // ---------- Events ----------
    rescanBtn.addEventListener('click', startScan)

    collectionFilters.addEventListener('change', function (event) {
      var input = event.target
      if (!input || input.name !== 'collection-filter' || busy) return
      selectedCollectionId = input.value || ''
      render()
    })

    document.getElementById('search').addEventListener('input', function (event) {
      query = String(event.target.value || '').trim().toLowerCase()
      render()
    })

    checkAll.addEventListener('change', function () {
      var on = checkAll.checked
      visibleRows().forEach(function (row) {
        if (effectiveVariable(row)) { if (on) delete unchecked[row.nodeId]; else unchecked[row.nodeId] = true }
      })
      render()
    })

    results.addEventListener('change', function (event) {
      var target = event.target
      if (!target) return
      if (target.matches && target.matches('[data-variable-select]')) {
        var nodeId = target.getAttribute('data-variable-select')
        selection[nodeId] = String(target.value || '')
        if (selection[nodeId]) delete unchecked[nodeId]
        render()
      } else if (target.matches && target.matches('[data-check]')) {
        var id = target.getAttribute('data-check')
        if (target.checked) delete unchecked[id]; else unchecked[id] = true
        render()
      }
    })

    results.addEventListener('click', function (event) {
      var locate = event.target && event.target.closest('[data-locate]')
      if (locate) {
        post({ type: 'focus-node', nodeId: locate.getAttribute('data-locate') })
        return
      }
      var button = event.target && event.target.closest('[data-apply-one]')
      if (!button || busy) return
      var nodeId = button.getAttribute('data-apply-one')
      var row = rows.filter(function (r) { return r.nodeId === nodeId })[0]
      var variableId = row ? effectiveVariable(row) : ''
      if (!variableId) { setStatus('เลือก variable ก่อน apply', 'error'); return }
      button.disabled = true
      post({ type: 'apply-one', nodeId: nodeId, variableId: variableId })
    })

    applyAll.addEventListener('click', function () {
      if (busy) return
      var items = visibleRows().filter(isChecked).map(function (row) {
        return { nodeId: row.nodeId, variableId: effectiveVariable(row) }
      })
      if (!items.length) return
      setBusy(true)
      setProgress('determinate', 0)
      setStatus('กำลัง apply 0 จาก ' + items.length + ' รายการ…')
      post({ type: 'apply-many', items: items })
    })

    window.onmessage = function (event) {
      var message = event.data && event.data.pluginMessage
      if (!message) return
      if (message.type === 'scan-start') {
        scanning = true
        rows = []
        setProgress('indeterminate')
        setBusy(true)
      } else if (message.type === 'scan-progress') {
        setStatus(message.message)
      } else if (message.type === 'scan-result') {
        rows = message.rows || []
        scanning = false
        loadCollections(message.collections || [])
        document.getElementById('unresolved').textContent = message.unresolvedCount
          ? 'อีก ' + message.unresolvedCount + ' layer ไม่มีชื่อที่ตรงกับ string variable จึงจับคู่ให้อัตโนมัติไม่ได้'
          : ''
        setProgress('')
        if (pendingSummary) { setStatus(pendingSummary.text, pendingSummary.kind); pendingSummary = '' }
        else setStatus(rows.length ? 'สแกนเสร็จแล้ว · ตรวจรายการก่อน apply (Undo ได้ด้วย ⌘Z)' : 'สแกนเสร็จแล้ว')
        setBusy(false)
      } else if (message.type === 'scan-error') {
        scanning = false
        setProgress('')
        setStatus('สแกนไม่สำเร็จ: ' + message.message, 'error')
        setBusy(false)
      } else if (message.type === 'apply-result') {
        setStatus(message.success ? 'apply สำเร็จ' : message.message, message.success ? 'ok' : 'error')
        if (message.success) rows = rows.filter(function (row) { return row.nodeId !== message.nodeId })
        render()
      } else if (message.type === 'apply-progress') {
        setProgress('determinate', message.completed / Math.max(1, message.total))
        setStatus('กำลัง apply ' + message.completed + ' จาก ' + message.total + ' · สำเร็จ ' + message.applied + ' · ไม่สำเร็จ ' + message.failed)
      } else if (message.type === 'apply-many-result') {
        pendingSummary = {
          text: 'เสร็จแล้ว · สำเร็จ ' + message.applied + (message.failed ? ' · ไม่สำเร็จ ' + message.failed : ''),
          kind: message.failed ? 'error' : 'ok'
        }
        busy = false
        startScan()
      }
    }

    var observer = new ResizeObserver(reportHeight)
    observer.observe(root)
    startScan()
  </script>
</body>
</html>
